[project]
name = "cadpilotv3"
version = "0.1.0"
description = "Multi-agent CAD generation pipeline using LangChain and LangGraph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cadquery>=2.7.0",
    "langchain>=1.2.15",
    "langsmith>=0.7.37",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
  "pytest>=8.3.5",
  "pytest-asyncio>=0.23.8",
  "ruff>=0.11.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/cadpilotv3"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
